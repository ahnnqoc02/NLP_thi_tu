<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thi Tứ – Sinh thơ lục bát</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/nolope.css') }}">
</head>
<body>
  <div class="app">

    <!-- ===== Đầu trang ===== -->
    <header class="topbar">
      <div class="brand">
        <div class="seal" aria-hidden="true">詩</div>
        <div>
          <h1 class="brand-name">Thi Tứ <span class="brand-han">詩思</span></h1>
          <p class="brand-tag">Hôm nay lòng bạn nghĩ về điều gì?</p>
        </div>
      </div>

      <svg class="clouds" viewBox="0 0 360 60" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
        <path d="M262 40c-6 0-10-4-10-8 0-5 5-8 10-7 2-5 8-8 14-7 6 1 10 5 10 9 5 0 9 3 9 7 0 4-4 6-8 6z"/>
        <path d="M268 36c4-2 10-2 14 0M276 31c3-1 7 0 9 2"/>
        <path d="M302 22c-5 0-8-3-8-6 0-4 4-6 8-5 2-4 7-6 12-5 5 1 8 4 8 7 4 0 7 2 7 5 0 3-3 4-6 4z"/>
        <path d="M318 40c-5 0-8-3-8-6 0-4 4-6 8-5 2-4 7-6 12-5 5 1 8 4 8 7 4 0 7 2 7 5 0 3-3 4-6 4z"/>
        <path d="M346 24c-4 0-6-2-6-5 0-3 3-5 7-4 2-3 6-4 9-3 4 1 6 3 6 6z"/>
      </svg>
    </header>

    <div class="layout">

      <!-- ===== Bảng điều khiển ===== -->
      <aside class="panel">
        <label class="field-label" for="chu-de">Chủ đề</label>
        <input class="input" id="chu-de" type="text" value="Mùa thu quê mẹ" autocomplete="off">

        <div class="chips">
          <button type="button" class="chip">Mùa thu</button>
          <button type="button" class="chip">Quê hương</button>
          <button type="button" class="chip">Mẹ</button>
          <button type="button" class="chip">Hà Nội</button>
          <button type="button" class="chip">Tết</button>
          <button type="button" class="chip">Mưa</button>
        </div>

        <label class="field-label" for="cam-xuc">Cảm xúc</label>
        <select class="input select" id="cam-xuc">
          <option>nhẹ nhàng, man mác</option>
          <option>vui tươi, rộn ràng</option>
          <option>buồn thương, hoài niệm</option>
          <option>trầm lắng, suy tư</option>
          <option>tha thiết, yêu thương</option>
        </select>

        <div class="row">
          <div>
            <label class="field-label" for="so-cap">Số cặp</label>
            <select class="input select" id="so-cap">
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="chat-luong">Chất lượng</label>
            <select class="input select" id="chat-luong">
              <option>Nhanh</option>
              <option selected>Cân bằng</option>
              <option>Chất lượng cao</option>
            </select>
          </div>
        </div>

        <button type="button" class="btn-primary" id="btn-generate">Sinh thơ</button>

        <hr class="divider">

        <span class="field-label">Gần đây</span>
        <ul class="recent" id="recent-list"></ul>
      </aside>

      <!-- ===== Thiệp thơ + hành động ===== -->
      <main>
        <article class="card" id="card">
          <span class="corner corner-tl"></span>
          <span class="corner corner-br"></span>
          <span class="leaf"></span>

          <figure class="scene">
            <svg viewBox="0 0 600 112" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
              <rect width="600" height="112" fill="#eadfc0"/>
              <circle cx="444" cy="38" r="20" fill="#cf5a48"/>
              <!-- núi xa -->
              <path d="M0 78 C60 66 100 70 150 58 C210 44 250 52 300 50 C350 48 380 28 430 30 C490 32 540 54 600 58 L600 112 L0 112Z" fill="#bcb097"/>
              <!-- núi gần -->
              <path d="M0 100 C60 88 130 80 200 84 C270 88 320 96 400 88 C470 80 540 82 600 88 L600 112 L0 112Z" fill="#74655a"/>
              <!-- cây khô -->
              <g stroke="#3b2c24" stroke-linecap="round" fill="none">
                <path d="M52 112 L52 56" stroke-width="3"/>
                <path d="M52 76 L38 66 M52 66 L64 58 M52 88 L42 82" stroke-width="1.6"/>
                <path d="M84 112 L84 48" stroke-width="3"/>
                <path d="M84 70 L96 60 M84 60 L74 52 M84 84 L96 78 M84 56 L90 48" stroke-width="1.6"/>
              </g>
              <!-- chim -->
              <g stroke="#3b2c24" stroke-width="1.4" fill="none" stroke-linecap="round">
                <path d="M57 50 q4-4 8 0 M65 50 q4-4 8 0"/>
                <path d="M66 46 q3-3 6 0"/>
              </g>
            </svg>
          </figure>

          <div class="card-body">
            <div class="poem-col">
              <div class="poem-title" id="poem-title"></div>
              <i class="lotus" aria-hidden="true">❀</i>

              <div class="poem" id="poem"></div>

              <div class="sign">
                <em id="poem-sign"></em>
                <div class="seal seal-sm" aria-hidden="true">詩</div>
              </div>
            </div>

            <aside class="notes">
              <h3 class="notes-title">Bên lề · Luật thơ</h3>

              <div class="rule">
                <span class="dots">
                  <span class="d b">B</span><span class="d t">T</span><span class="d b">B</span>
                </span>
                <span class="rule-name">câu lục</span>
              </div>
              <div class="rule">
                <span class="dots">
                  <span class="d b">B</span><span class="d t">T</span><span class="d b">B</span><span class="d b">B</span>
                </span>
                <span class="rule-name">câu bát</span>
              </div>

              <section id="notes-text"></section>
            </aside>
          </div>
        </article>

        <div class="actions">
          <button type="button" class="btn" id="btn-copy">Sao chép</button>
          <button type="button" class="btn btn-dark" id="btn-export">Xuất thành thiệp</button>
          <button type="button" class="btn" id="btn-clear">Xoá</button>
        </div>
      </main>

    </div>
  </div>

  <script src="{{ url_for('static', filename='js/nololpe.js') }}"></script>
</body>
</html>
